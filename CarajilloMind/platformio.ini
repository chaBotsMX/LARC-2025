[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 9600
lib_deps = 
	adafruit/Adafruit TCS34725@^1.4.4
	adafruit/Adafruit_VL53L0X@^1.2.4
	luisllamasbinaburo/ColorConverter@^1.1.0 
    adafruit/Adafruit PWM Servo Driver Library@^2.4.1
    wire

